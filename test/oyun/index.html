<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101c;color:#e8f4ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:480px;padding:12px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.scores{width:100%;max-width:440px;background:#0d1828;border:1px solid #1c2f47;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;font-size:14px}
.scores b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#52d3ff}
#status{min-height:22px;font-size:14px;text-align:center;color:#cfe9ff;margin:0}
#status.over{color:#ff6b6b}
#status.won{color:#55d6a8}
#board{width:min(92vw,440px);aspect-ratio:1/1;background:#0d1828;border:2px solid #1c2f47;border-radius:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{background:#132238;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:clamp(18px,6vw,28px);color:#e8f4ff;min-height:0}
.cell.v2{background:#1c3550}
.cell.v4{background:#235a7a}
.cell.v8{background:#1f8a70;color:#07101c}
.cell.v16{background:#2fae83;color:#07101c}
.cell.v32{background:#52d3ff;color:#07101c}
.cell.v64{background:#7fe0ff;color:#07101c}
.cell.v128{background:#55d6a8;color:#07101c}
.cell.v256{background:#7be3b8;color:#07101c}
.cell.v512{background:#ffd166;color:#07101c}
.cell.v1024{background:#ff9f5a;color:#07101c}
.cell.v2048{background:#ff6b6b;color:#07101c}
.cell.vsuper{background:#e056fd;color:#07101c}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:#52d3ff;color:#07101c;border:2px solid #52d3ff;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
button:hover:not(:disabled){background:#7fe0ff;border-color:#7fe0ff}
button:focus-visible{outline:3px solid #55d6a8;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
#newBtn{background:#0d1828;color:#52d3ff}
#newBtn:hover:not(:disabled){background:#16263c}
#help{font-size:13px;color:#9db4cc;text-align:center;max-width:440px;margin:0}
</style>
</head>
<body>
<main>
<div class="scores" aria-label="Skor tablosu"><span>Skor: <b id="score">0</b></span><span>En iyi: <b id="best">0</b></span></div>
<p id="status" role="status">Hazır</p>
<div id="board" role="grid" aria-label="4 carpi 4 2048 oyun tahtasi. Ok tuslari veya WASD ile kaydir."></div>
<div class="controls"><button id="newBtn" type="button">Yeni Oyun</button></div>
<p id="help">Ok tuşları / WASD: kaydır. Eşit taşlar birleşir. 2048'e ulaş, hamle bitmeden kazan.</p>
</main>
<script id="engine">
function createGame(options){
options=options||{};
var SIZE=4;
var rand=options.random||Math.random;
function emptyGrid(){var g=[],r,c;for(r=0;r<SIZE;r++){g.push([]);for(c=0;c<SIZE;c++)g[r].push(0);}return g;}
function seedGrid(cells){var g=emptyGrid(),i,r,c;for(i=0;i<cells.length;i++){r=cells[i].row!==undefined?cells[i].row:cells[i].y;c=cells[i].col!==undefined?cells[i].col:cells[i].x;g[r][c]=cells[i].v;}return g;}
function inOpts(o){return o&&Object.prototype.hasOwnProperty.call(options,o);}
var game={size:SIZE,grid:emptyGrid(),score:0,status:"ready",won:false};
if(options.grid||options.cells)game.grid=seedGrid(options.grid||options.cells);
if(inOpts("score"))game.score=options.score;
if(inOpts("status"))game.status=options.status;
function emptyCells(){
var out=[],r,c;
for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++)if(game.grid[r][c]===0)out.push({row:r,col:c});
return out;
}
function placeRandom(){
var empty=emptyCells();
if(empty.length===0)return null;
var i=Math.floor(rand()*empty.length)%empty.length;
var v=rand()<0.9?2:4;
game.grid[empty[i].row][empty[i].col]=v;
return {row:empty[i].row,col:empty[i].col,v:v};
}
game.spawnTile=placeRandom;
game.emptyCells=function(){return emptyCells().map(function(p){return {x:p.col,y:p.row,row:p.row,col:p.col};});};
function slideRowLeft(row){
var vals=row.filter(function(v){return v!==0;});
var out=[],gained=0,i=0;
while(i<vals.length){
if(i+1<vals.length&&vals[i]===vals[i+1]){var m=vals[i]*2;out.push(m);gained+=m;i+=2;}
else{out.push(vals[i]);i+=1;}
}
while(out.length<SIZE)out.push(0);
return {row:out,gained:gained};
}
function getCol(ci){var col=[],rr;for(rr=0;rr<SIZE;rr++)col.push(game.grid[rr][ci]);return col;}
function setCol(ci,col){var rr;for(rr=0;rr<SIZE;rr++)game.grid[rr][ci]=col[rr];}
function movesAvailable(){
var r,c;
for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++)if(game.grid[r][c]===0)return true;
for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++){
if(c+1<SIZE&&game.grid[r][c]===game.grid[r][c+1])return true;
if(r+1<SIZE&&game.grid[r][c]===game.grid[r+1][c])return true;
}
return false;
}
game.movesAvailable=movesAvailable;
game.canMove=movesAvailable;
game.move=function(dir){
if(game.status!=="playing")return {moved:false,gained:0,status:game.status};
var ok=dir==="left"||dir==="right"||dir==="up"||dir==="down";
if(!ok)return {moved:false,gained:0,status:game.status};
var before=JSON.stringify(game.grid);
var gained=0,r,c;
if(dir==="left"){
for(r=0;r<SIZE;r++){var s=slideRowLeft(game.grid[r]);game.grid[r]=s.row;gained+=s.gained;}
}else if(dir==="right"){
for(r=0;r<SIZE;r++){var rev=game.grid[r].slice().reverse();var s2=slideRowLeft(rev);game.grid[r]=s2.row.reverse();gained+=s2.gained;}
}else if(dir==="up"){
for(c=0;c<SIZE;c++){var su=slideRowLeft(getCol(c));setCol(c,su.row);gained+=su.gained;}
}else{
for(c=0;c<SIZE;c++){var sd=slideRowLeft(getCol(c).reverse());setCol(c,sd.row.reverse());gained+=sd.gained;}
}
var moved=JSON.stringify(game.grid)!==before;
if(!moved)return {moved:false,gained:0,status:game.status};
game.score+=gained;
placeRandom();
var flat=game.grid.flat();
if(flat.indexOf(2048)!==-1){game.won=true;game.status="won";return {moved:true,gained:gained,status:game.status};}
if(movesAvailable()){game.status="playing";return {moved:true,gained:gained,status:game.status};}
game.status="over";
return {moved:true,gained:gained,status:game.status};
};
function resetState(){
game.grid=emptyGrid();
game.score=0;
game.won=false;
game.status="playing";
placeRandom();
placeRandom();
}
game.start=function(){
if(game.status==="over"||game.status==="won"){resetState();return game.status;}
if(game.status==="ready"){
var flat=game.grid.flat();
if(flat.every(function(v){return v===0;})){resetState();return game.status;}
game.status="playing";
}
return game.status;
};
game.restart=function(){resetState();return game.status;};
game.newGame=function(){resetState();return game.status;};
return game;
}
</script>
<script>
(function(){
var game=createGame({});
var board=document.getElementById("board");
var scoreEl=document.getElementById("score");
var bestEl=document.getElementById("best");
var statusEl=document.getElementById("status");
var newBtn=document.getElementById("newBtn");
var best=0;
try{best=parseInt(window.localStorage.getItem("game2048Best"),10)||0;}catch(e){best=0;}
bestEl.textContent=String(best);
var cells=[];
(function build(){
var r,c;
for(r=0;r<4;r++)for(c=0;c<4;c++){
var d=document.createElement("div");
d.className="cell";
d.setAttribute("role","gridcell");
cells.push(d);
board.appendChild(d);
}
})();
function statusText(){
if(game.status==="ready")return "Hazır - başlamak için Yeni Oyun'a bas";
if(game.status==="playing")return "Oynanıyor";
if(game.status==="won")return "Kazandın! Skor: "+game.score;
if(game.status==="over")return "Oyun Bitti - skor: "+game.score;
return game.status;
}
function updateUI(){
var flat=game.grid.flat();
for(var i=0;i<16;i++){
var v=flat[i];
cells[i].textContent=v===0?"":String(v);
var cls="cell";
if(v!==0)cls+=" "+(v>2048?"vsuper":"v"+v);
cells[i].className=cls;
}
scoreEl.textContent=String(game.score);
bestEl.textContent=String(best);
statusEl.textContent=statusText();
statusEl.className=game.status==="over"?"over":(game.status==="won"?"won":"");
}
function afterMove(){
if(game.score>best){best=game.score;try{window.localStorage.setItem("game2048Best",String(best));}catch(e){}}
updateUI();
}
function doMove(dir){
if(game.status!=="playing")return;
var res=game.move(dir);
if(res.moved)afterMove();
else updateUI();
}
newBtn.addEventListener("click",function(){game.restart();updateUI();});
document.addEventListener("keydown",function(e){
var k=e.key,dir=null;
if(k==="ArrowLeft"||k==="a"||k==="A")dir="left";
else if(k==="ArrowRight"||k==="d"||k==="D")dir="right";
else if(k==="ArrowUp"||k==="w"||k==="W")dir="up";
else if(k==="ArrowDown"||k==="s"||k==="S")dir="down";
else return;
e.preventDefault();
doMove(dir);
});
var tx=0,ty=0,touching=false;
board.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;touching=true;},{passive:true});
board.addEventListener("touchend",function(e){
if(!touching)return;touching=false;
var t=e.changedTouches[0];
var dx=t.clientX-tx,dy=t.clientY-ty;
if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
if(Math.abs(dx)>Math.abs(dy))doMove(dx>0?"right":"left");
else doMove(dy>0?"down":"up");
},{passive:true});
document.addEventListener("visibilitychange",function(){updateUI();});
updateUI();
})();
</script>
</body>
</html>
