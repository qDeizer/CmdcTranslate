<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uzay Shooter — Three.js</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07101c;color:#e8f4ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;overflow-x:hidden}
main{width:100%;max-width:520px;padding:12px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
h1{font-size:20px;letter-spacing:.5px}
h1 span{color:#52d3ff}
.scores{width:100%;max-width:480px;background:#0d1828;border:1px solid #1c2f47;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;font-size:14px}
.scores b{font-family:ui-monospace,Menlo,Consolas,monospace;color:#52d3ff}
#status{min-height:22px;font-size:14px;text-align:center;color:#cfe9ff}
#status.over{color:#ff6b6b}
#status.won{color:#55d6a8}
#wrap{position:relative;width:min(94vw,480px);aspect-ratio:3/4;border:2px solid #1c2f47;border-radius:10px;overflow:hidden;background:#040a14}
#game{width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(4,10,20,.72);text-align:center;padding:16px}
#overlay.hidden{display:none}
#overlay h2{font-size:22px}
#overlay p{font-size:14px;color:#9db4cc;max-width:340px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:#52d3ff;color:#07101c;border:2px solid #52d3ff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:#7fe0ff;border-color:#7fe0ff}
button:focus-visible{outline:3px solid #55d6a8;outline-offset:2px}
button.ghost{background:#0d1828;color:#52d3ff}
button.ghost:hover{background:#16263c}
#help{font-size:13px;color:#9db4cc;text-align:center;max-width:440px}
#hud{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#9db4cc}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<main>
<h1>🚀 Uzay <span>Shooter</span></h1>
<div class="scores" aria-label="Skor tablosu">
<span>Skor: <b id="score">0</b></span>
<span>Can: <b id="lives">3</b></span>
<span>En iyi: <b id="best">0</b></span>
</div>
<p id="status" role="status">Hazır</p>
<div id="wrap">
<canvas id="game" aria-label="Uzay shooter oyun alani"></canvas>
<div id="overlay">
<h2 id="ovTitle">Uzay Shooter</h2>
<p id="ovText">Gelen meteorları vur, hayatta kal! Her 25 skor hız artar.</p>
<button id="startBtn" type="button">Oyuna Başla</button>
</div>
</div>
<div class="controls">
<button id="newBtn" class="ghost" type="button">Yeniden Başlat</button>
<button id="fireBtn" type="button">Ateş Et 🔥</button>
</div>
<p id="help">← → / A D: hareket &nbsp;•&nbsp; Boşluk: ateş &nbsp;•&nbsp; Telefonda: parmağınla sürükle, Ateş Et'e bas.<br><span id="hud">Seviye 1 • 3 canla başlarsın</span></p>
</main>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('game');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const startBtn = document.getElementById('startBtn');
const newBtn = document.getElementById('newBtn');
const fireBtn = document.getElementById('fireBtn');
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040a14);
scene.fog = new THREE.Fog(0x040a14, 18, 40);
const camera = new THREE.PerspectiveCamera(60, 3 / 4, 0.1, 100);
camera.position.set(0, 7.5, 9);
camera.lookAt(0, 0, -2);

scene.add(new THREE.AmbientLight(0x88aaff, 0.7));
const sun = new THREE.DirectionalLight(0x52d3ff, 1.1);
sun.position.set(4, 8, 6);
scene.add(sun);
const mint = new THREE.PointLight(0x55d6a8, 12, 20);
mint.position.set(-4, 3, 2);
scene.add(mint);

// zemin ızgarası
const grid = new THREE.GridHelper(24, 24, 0x52d3ff, 0x1c2f47);
grid.position.z = -6;
scene.add(grid);

// yıldızlar
{
  const g = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i < 250; i++) pts.push((Math.random() - .5) * 30, Math.random() * 14 - 2, -Math.random() * 28);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfe9ff, size: 0.08 })));
}

// oyuncu gemisi
const ship = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 1.4, 4),
    new THREE.MeshStandardMaterial({ color: 0x52d3ff, roughness: .35, metalness: .4 })
  );
  body.rotation.x = -Math.PI / 2;
  ship.add(body);
  const wing = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.12, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x55d6a8, roughness: .4 })
  );
  wing.position.z = 0.45;
  ship.add(wing);
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.22, 0.8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffd166 })
  );
  flame.rotation.x = Math.PI / 2;
  flame.position.z = 0.9;
  flame.name = 'flame';
  ship.add(flame);
}
ship.position.set(0, 0, 4);
scene.add(ship);

const bullets = [];  // {mesh, alive}
const meteors = [];  // {mesh, speed, spin, alive}
const bulletGeo = new THREE.SphereGeometry(0.14, 10, 10);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
const meteorGeo = new THREE.IcosahedronGeometry(0.55, 0);
const meteorMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: .7, flatShading: true });
const meteorMat2 = new THREE.MeshStandardMaterial({ color: 0x9db4cc, roughness: .7, flatShading: true });

let running = false, over = false;
let score = 0, lives = 3, level = 1, lastTime = 0, spawnTimer = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('shooterBest'), 10) || 0; } catch (e) { best = 0; }
bestEl.textContent = String(best);

function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ''; }
function syncUI() {
  scoreEl.textContent = String(score);
  livesEl.textContent = String(lives);
  bestEl.textContent = String(best);
  hud.textContent = 'Seviye ' + level + ' • Meteor hızı x' + (1 + (level - 1) * 0.25).toFixed(2);
}

function fire() {
  if (!running || over) return;
  const m = new THREE.Mesh(bulletGeo, bulletMat);
  m.position.copy(ship.position);
  m.position.z -= 1;
  scene.add(m);
  bullets.push({ mesh: m, alive: true });
}

function spawnMeteor() {
  const m = new THREE.Mesh(meteorGeo, Math.random() < .5 ? meteorMat : meteorMat2);
  const s = 0.6 + Math.random() * 0.9;
  m.scale.setScalar(s);
  m.position.set((Math.random() - .5) * 9, 0, -14 - Math.random() * 4);
  m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  scene.add(m);
  meteors.push({ mesh: m, speed: (3 + Math.random() * 2) * (1 + (level - 1) * 0.25), spin: (Math.random() - .5) * 3, alive: true });
}

function clearField() {
  for (const b of bullets) scene.remove(b.mesh);
  for (const m of meteors) scene.remove(m.mesh);
  bullets.length = 0; meteors.length = 0;
}

function start() {
  clearField();
  score = 0; lives = 3; level = 1; spawnTimer = 0;
  ship.position.set(0, 0, 4);
  running = true; over = false;
  overlay.classList.add('hidden');
  setStatus('Oynanıyor');
  syncUI();
}

function gameOver() {
  over = true; running = false;
  if (score > best) { best = score; try { localStorage.setItem('shooterBest', String(best)); } catch (e) {} }
  syncUI();
  setStatus('Oyun Bitti — skor: ' + score, 'over');
  ovTitle.textContent = '💥 Oyun Bitti';
  ovText.textContent = 'Skorun: ' + score + ' • En iyi: ' + best + ' • Tekrar dene!';
  startBtn.textContent = 'Tekrar Oyna';
  overlay.classList.remove('hidden');
}

function resize() {
  const w = canvas.clientWidth || 480, h = canvas.clientHeight || 640;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const keys = {};
addEventListener('keydown', (e) => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') fire();
  if (e.key === 'Enter' && !running) start();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

// dokunmatik sürükleme
let dragging = false, lastX = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging || !running) return;
  const dx = (e.clientX - lastX) / canvas.clientWidth * 10;
  lastX = e.clientX;
  ship.position.x = THREE.MathUtils.clamp(ship.position.x + dx, -4.5, 4.5);
});
addEventListener('pointerup', () => { dragging = false; });

startBtn.addEventListener('click', start);
newBtn.addEventListener('click', start);
fireBtn.addEventListener('click', fire);

function boxHit(a, b, r) {
  const dx = a.position.x - b.position.x, dz = a.position.z - b.position.z;
  return dx * dx + dz * dz < r * r;
}

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastTime) / 1000 || 0, 0.05);
  lastTime = t;

  // alev animasyonu
  const flame = ship.getObjectByName('flame');
  if (flame) flame.scale.setScalar(1 + Math.sin(t / 90) * 0.25);
  grid.position.z += dt * 1.5;
  if (grid.position.z > 0) grid.position.z = -6;

  if (running && !over) {
    // hareket
    const sp = 8 * dt;
    if (keys['arrowleft'] || keys['a']) ship.position.x -= sp;
    if (keys['arrowright'] || keys['d']) ship.position.x += sp;
    ship.position.x = THREE.MathUtils.clamp(ship.position.x, -4.5, 4.5);
    ship.rotation.z = THREE.MathUtils.lerp(ship.rotation.z,
      (keys['arrowleft'] || keys['a'] ? 0.35 : 0) + (keys['arrowright'] || keys['d'] ? -0.35 : 0), 0.2);

    // meteor üret
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnMeteor(); spawnTimer = Math.max(0.25, 0.9 - level * 0.08); }

    // mermiler
    for (const b of bullets) {
      if (!b.alive) continue;
      b.mesh.position.z -= 14 * dt;
      if (b.mesh.position.z < -18) { b.alive = false; scene.remove(b.mesh); }
    }
    // meteorlar
    for (const m of meteors) {
      if (!m.alive) continue;
      m.mesh.position.z += m.speed * dt;
      m.mesh.rotation.x += m.spin * dt;
      m.mesh.rotation.y += m.spin * dt;
      // mermi çarptı mı?
      for (const b of bullets) {
        if (b.alive && boxHit(b.mesh, m.mesh, 0.8 * m.mesh.scale.x + 0.2)) {
          b.alive = false; m.alive = false;
          scene.remove(b.mesh); scene.remove(m.mesh);
          score += 10;
          level = Math.min(10, 1 + Math.floor(score / 100));
          if (score > best) { best = score; try { localStorage.setItem('shooterBest', String(best)); } catch (e) {} }
          syncUI();
          break;
        }
      }
      if (!m.alive) continue;
      // gemiye çarptı mı / geçti mi?
      if (boxHit(m.mesh, ship, 0.9)) {
        m.alive = false; scene.remove(m.mesh);
        lives--;
        syncUI();
        if (lives <= 0) { gameOver(); }
        else setStatus('Oynanıyor — ' + lives + ' can kaldı');
      } else if (m.mesh.position.z > 6) {
        m.alive = false; scene.remove(m.mesh);
      }
    }
  }
  renderer.render(scene, camera);
}

resize();
syncUI();
setStatus('Hazır — başlamak için Oyuna Başla’ya bas');
requestAnimationFrame(loop);
</script>
</body>
</html>
